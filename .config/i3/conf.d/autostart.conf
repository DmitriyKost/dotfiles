exec --no-startup-id dex --autostart --environment i3

# shadowsocks
exec --no-startup-id ss-local -c ~/.ss-helsinki.json -u

# xray
# exec --no-startup-id xray -config /usr/local/etc/xray/config.json

# wallpaper
# exec --no-startup-id feh --no-fehbg --bg-fill "solid:#000000"
exec --no-startup-id feh --bg-scale ~/images/2560x1440.jpg

# causes input/rendering lags. consider disabling some options in nvidia if want to enable it back
# exec --no-startup-id picom --config ~/.config/picom/picom.conf

exec --no-startup-id alacritty -e tmux
exec --no-startup-id firefox

exec --no-startup-id nm-applet

exec --no-startup-id ~/.config/i3blocks/player_watcher.sh
exec --no-startup-id ~/.config/i3blocks/kb_watcher.sh
exec --no-startup-id setxkbmap -layout "us,ru" -option "grp:alt_shift_toggle"
