# ─── Terminal capabilities ───────────────────────────────────────────────────
set -g  default-terminal "screen-256color"
# RGB color + curly/colored underlines for any outer terminal that supports them.
set -as terminal-features "*:RGB:usstyle:ccolour"

# Pass through image-protocol escapes (kitty graphics, sixel, etc.).
set -g  allow-passthrough on
set -ag update-environment "TERM TERM_PROGRAM"

# ─── Behavior ────────────────────────────────────────────────────────────────
set -g  mouse on
setw -g mode-keys vi

# Prefix: C-a (override the default C-b)
set -g  prefix C-a
unbind-key C-b
bind-key C-a send-prefix

# 1-indexed windows / panes, auto-renumber on close
set -g  base-index 1
setw -g pane-base-index 1
set -g  renumber-windows on

# ─── Keybindings ─────────────────────────────────────────────────────────────
# Splits open in the current pane's directory
bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"

# Copy-mode (vi-style)
bind-key v copy-mode \; send-keys -X begin-selection
bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y   send-keys -X copy-selection-and-cancel

# ─── Plugins (tpm) ───────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

run '~/.tmux/plugins/tpm/tpm'

# ─── Status bar ──────────────────────────────────────────────────────────────
set -g window-style                 "default"
set -g window-active-style          "default"

set -g status                       on
set -g status-position              top
set -g status-justify               left
set -g status-style                 "bg=black,fg=white"
set -g status-left                  ""
set -g status-left-length           0
set -g status-right                 " #S:#h "
set -g status-right-length          32

set -g window-status-format         " #I #W "
set -g window-status-current-format "#[bg=brightblack,fg=white] #I #W "
set -g window-status-style          "dim"
set -g window-status-current-style  "nodim"
set -g window-status-activity-style "fg=red"
set -g window-status-separator      ""

set -g pane-border-status           off
set -g pane-border-style            "fg=brightblack"
set -g pane-active-border-style     "fg=brightblack"

set -g message-style                "bg=yellow,fg=black"
set -g mode-style                   "bg=brightblack,fg=white"
