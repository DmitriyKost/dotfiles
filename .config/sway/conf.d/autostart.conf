exec dbus-update-activation-environment DISPLAY WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP

exec dex --autostart --environment sway

# notifications
exec mako

exec_always ~/.local/bin/sway-layout-osd

# screencare
exec_always sh -c 'pkill -x swayidle 2>/dev/null || true; exec swayidle -w timeout 300 "swaylock -f -c 000000" before-sleep "swaylock -f -c 000000"'

# screen sharing portal (wlroots backend)
exec /usr/libexec/xdg-desktop-portal-wlr -r

# shadowsocks
exec ss-local -c ~/.ss-helsinki.json -u

# xray
# exec xray -config /usr/local/etc/xray/config.json

# wallpaper
# exec swaybg -i ~/images/2560x1440.jpg -m fill
exec swaybg -c '#000000'

exec kitty -e tmux
exec firefox
