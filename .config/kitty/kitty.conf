# ── font ──────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font Mono
font_size        20.0
disable_ligatures always

text_composition_strategy 1.35 15

# ── cursor ────────────────────────────────────────────────────
cursor_shape          beam
cursor_blink_interval 0

cursor_beam_thickness 2.0
cursor_underline_thickness 2.0

cursor_shape_unfocused underline

# ── mouse ─────────────────────────────────────────────────────
# hide pointer after 3s; negative = hide immediately on keypress, show on move
mouse_hide_wait       -1.0

# ── window ────────────────────────────────────────────────────
hide_window_decorations  yes
window_padding_width     0
remember_window_size     no
tab_bar_style hidden
placement_strategy top-left
# background_opacity 0.5
# maximized start handled by WM rule or --start-as=maximized (see notes)

# ── bell ──────────────────────────────────────────────────────
enable_audio_bell        no

# ── theme ─────────────────────────────────────────────────────
# switch by changing the included file: warm.conf or toxic.conf
include warm.conf
